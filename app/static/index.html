<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DrayTek Network Monitor</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <header>
    <h1>DrayTek Network Monitor</h1>
    <div class="header-right">
      <div id="health" class="health">connecting…</div>
      <button id="settings-btn" class="icon-btn" title="Settings &amp; troubleshooting" aria-label="Settings & troubleshooting">⚙</button>
    </div>
  </header>

  <main>
    <section class="panel devices">
      <div class="panel-head">
        <h2>Devices</h2>
        <input id="filter" placeholder="filter by name / IP / MAC" />
      </div>
      <table id="device-table">
        <colgroup>
          <col class="col-device" />
          <col class="col-ip" />
          <col class="col-mac" />
          <col class="col-rate" />
          <col class="col-rate" />
        </colgroup>
        <thead>
          <tr>
            <th class="sortable" data-sort="hostname">Device <span class="sort-ind"></span></th>
            <th class="sortable" data-sort="ip">IP <span class="sort-ind"></span></th>
            <th class="sortable" data-sort="mac">MAC <span class="sort-ind"></span></th>
            <th class="sortable num" data-sort="tx_bps">TX <span class="parens">(upload)</span><span class="sort-ind"></span></th>
            <th class="sortable num" data-sort="rx_bps">RX <span class="parens">(download)</span><span class="sort-ind"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel chart-panel">
      <div class="panel-head">
        <h2 id="chart-title">Top talkers — last hour</h2>
        <select id="range">
          <option value="1">1 hour</option>
          <option value="6">6 hours</option>
          <option value="24" selected>24 hours</option>
          <option value="168">7 days</option>
          <option value="720">30 days</option>
        </select>
      </div>
      <div class="chart-wrap"><canvas id="main-chart"></canvas></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="modal-close" aria-label="Close">&times;</button>
      <header class="modal-head">
        <div>
          <h2 id="m-name">—</h2>
          <div class="meta">
            <span id="m-ip"></span>
            <span id="m-mac"></span>
            <span id="m-vendor"></span>
          </div>
        </div>
        <div class="totals">
          <div><span class="lbl">TX now</span><span id="m-tx">—</span></div>
          <div><span class="lbl">RX now</span><span id="m-rx">—</span></div>
          <div><span class="lbl">First seen</span><span id="m-first">—</span></div>
          <div><span class="lbl">Last seen</span><span id="m-last">—</span></div>
        </div>
      </header>
      <div class="modal-controls">
        <label>Window:
          <select id="m-range">
            <option value="1">1 hour</option>
            <option value="6">6 hours</option>
            <option value="24" selected>24 hours</option>
            <option value="168">7 days</option>
            <option value="720">30 days</option>
          </select>
        </label>
        <label>Note:
          <input id="m-note" placeholder="e.g. living room TV" />
          <button id="m-save-note">Save</button>
        </label>
      </div>
      <div class="chart-wrap big"><canvas id="m-chart"></canvas></div>
    </div>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" id="settings-close" aria-label="Close">&times;</button>
      <header class="modal-head">
        <div>
          <h2>Settings &amp; Troubleshooting</h2>
          <div class="meta"><span id="diag-summary">running checks…</span></div>
        </div>
        <div class="totals">
          <div><span class="lbl">Last checked</span><span id="diag-updated">—</span></div>
        </div>
      </header>
      <div class="modal-controls">
        <button id="diag-refresh">Refresh now</button>
        <span class="diag-note">Auto-refreshes while open. No traffic? Feed test data with <code>tools/netflow_sim.py</code>.</span>
      </div>
      <div id="diag-list" class="diag-list"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
