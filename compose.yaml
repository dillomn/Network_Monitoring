name: draymon

services:
  draymon:
    build: .
    container_name: draymon
    restart: unless-stopped
    ports:
      # host:container -- Guacamole owns 8080 on the Pi, so we publish on 8090.
      - "8090:8080"
      # NetFlow v9 ingest from the DrayTek. Must match Collector Port in
      # router web UI (System Maintenance → NetFlow) and NETFLOW_PORT in .env.
      - "2055:2055/udp"
    env_file: .env
    environment:
      - DB_PATH=/data/netmon.db
      # `show traffic <ip>` on the Vigor 2765 reports kilobits/sec; this
      # scales it to bps. Verified against the router's Data Flow Monitor
      # (raw 88064 → 88 Mbps). Set here (overrides any stale value in .env)
      # because it's the verified unit for this hardware. Other DrayTek
      # models may differ — recalibrate via /debug/ssh/raw-traffic.
      - TRAFFIC_UNIT=kilobits_per_second
      # Poll as fast as the SSH command batch allows (the loop waits this
      # long *after* each cycle). Effective cadence is bounded by how many
      # devices we `show traffic` per cycle, which is why we only poll LAN
      # clients (see _update_device_rates).
      - POLL_INTERVAL=1
    volumes:
      - draymon_data:/data

volumes:
  draymon_data:
