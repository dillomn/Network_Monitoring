name: draymon

services:
  draymon:
    build: .
    container_name: draymon
    restart: unless-stopped
    ports:
      # host:container -- Guacamole owns 8080 on the Pi, so we publish on 8090.
      - "8090:8080"
      # NetFlow v9 ingest from the DrayTek. Must match Collector Port in
      # router web UI (System Maintenance → NetFlow) and NETFLOW_PORT in .env.
      - "2055:2055/udp"
    env_file: .env
    environment:
      - DB_PATH=/data/netmon.db
      # Debug-only now: scales the legacy `show traffic <ip>` series used by
      # /debug/ssh/raw-traffic to cross-check NetFlow against the router's
      # Data Flow Monitor page. Not on the live data path. kilobits/sec is
      # the Vigor 2765 unit (raw 88064 → 88 Mbps); recalibrate per model.
      - TRAFFIC_UNIT=kilobits_per_second
      # Seconds the SSH poll loop sleeps between cycles. The loop only does
      # discovery (DHCP+ARP), WAN totals, and the NAT port-map now — NetFlow
      # owns per-device traffic — so 1s is cheap on the router.
      - POLL_INTERVAL=1
    volumes:
      - draymon_data:/data

volumes:
  draymon_data:
