name: draymon

services:
  draymon:
    build: .
    container_name: draymon
    restart: unless-stopped
    ports:
      # host:container -- Guacamole owns 8080 on the Pi, so we publish on 8090.
      - "8090:8080"
    env_file: .env
    environment:
      - DB_PATH=/data/netmon.db
    volumes:
      - draymon_data:/data

volumes:
  draymon_data:
