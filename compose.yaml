name: draymon

services:
  draymon:
    build: .
    container_name: draymon
    restart: unless-stopped
    ports:
      # host:container -- Guacamole owns 8080 on the Pi, so we publish on 8090.
      - "8090:8080"
      # NetFlow v9 ingest from the DrayTek. Must match Collector Port in
      # router web UI (System Maintenance → NetFlow) and NETFLOW_PORT in .env.
      - "2055:2055/udp"
    env_file: .env
    environment:
      - DB_PATH=/data/netmon.db
      # LIVE PATH: scales the `show traffic <ip>` Data Flow Monitor series,
      # which is the live per-device rate source (NetFlow reports a flow only
      # when it ends). A wrong unit scales every live rate. kilobits/sec is
      # the Vigor 2765 unit (raw 88064 → 88 Mbps); recalibrate per model via
      # /debug/ssh/raw-traffic?ip=<ip>.
      - TRAFFIC_UNIT=kilobits_per_second
      # Seconds the SSH poll loop sleeps between cycles. Each cycle does
      # discovery (DHCP+ARP), WAN totals, the NAT port-map (every 5th), and
      # ONE Data Flow Monitor reading (round-robin over active devices).
      - POLL_INTERVAL=1
    volumes:
      - draymon_data:/data

volumes:
  draymon_data:
